[project]
name = "arkitekt-runtime"
dynamic = ["version"]
description = "the execution core of an Arkitekt app: agent, actors, tasks, journal, state and structure serialization, shared by every runtime"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
# Every runtime of a declared app (rekuest's distributed agent, arkitekt-fastapi's
# server) executes actions the same way, so this is what they share. It carries no
# transport and no client: no websockets, no rath, no graphql-core.
dependencies = [
    "arkitekt-spec>=1.3",
    "pydantic>=2.11",
    "koil>=3.3.3",
    "janus>=2.0.0",
    "jsonpatch>=1.33",
]

[project.optional-dependencies]
# The Qt actifiers (actors that run in a Qt event loop).
qt = ["qtpy>=2.4"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26",
    "python-semantic-release>=9.21.0",
    "ruff>0.11",
    "basedpyright>=1.21",
]

[tool.hatch.build.targets.sdist]
include = ["arkitekt_runtime"]

[tool.hatch.build.targets.wheel]
include = ["arkitekt_runtime"]

[tool.basedpyright]
include = ["arkitekt_runtime"]
exclude = ["**/__pycache__", "tests"]
# Moved from rekuest, which checked it in standard mode.
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# rekuest's rule set, where this code came from.
select = ["E4", "E7", "E9", "F", "UP"]
ignore = ["UP037", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.semantic_release]
# No version_toml/version_variables: the release version lives only in the git
# tag, which hatch-vcs reads at build time. CI runs the version command with
# `commit: false`, so PSR tags HEAD and creates the GitHub Release without
# pushing a bump commit to the branch.
#
# The semantic-release GitHub Action runs in a Docker container without uv, so
# install it first. PSR builds *before* it tags, so hatch-vcs is told the new
# version explicitly ($NEW_VERSION is injected by PSR) instead of deriving a
# `.devN+g...` local version that PyPI would reject.
build_command = """
    python -m pip install 'uv>=0.7.12'
    export SETUPTOOLS_SCM_PRETEND_VERSION="$NEW_VERSION"
    uv build
"""

# main -> stable X.Y.Z. next -> prereleases X.Y.Z-rc.N. N.x -> maintenance.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an
# older major after a new major has shipped from main.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog focused on user-facing changes. These patterns only filter
# what's rendered -- they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ',
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The version is derived from the nearest git tag (vX.Y.Z); nothing in the
# tree is bumped on release. Shallow CI clones see no tag and get the fallback.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
